<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="../">
  <title>I EAT BUSAN — isolated browser checks</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
  <style>
    #fixture-panel{position:fixed;left:12px;top:12px;z-index:10000;width:280px;max-height:calc(100dvh - 24px);overflow:auto;padding:12px;background:#fff;border:2px solid #3A7291;border-radius:12px;box-shadow:0 4px 20px #0002;font:12px/1.5 system-ui,sans-serif}
    #fixture-panel h2{margin:0;font-size:15px}#fixture-panel p{margin:7px 0}#fixture-panel label{display:block;margin-top:9px}#fixture-panel select,#fixture-panel button{border:1px solid #b8c6cc;background:#f5f8fa;border-radius:5px;padding:5px;margin-top:3px;font:inherit}#fixture-panel input[type=checkbox]{vertical-align:middle}#fixture-panel output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px;padding:7px;background:#eff5f8}#fixture-log{max-height:180px;overflow:auto;margin:6px 0 0;white-space:pre-wrap;font:11px/1.4 monospace}#fixture-panel[data-collapsed=true]{width:auto}#fixture-panel[data-collapsed=true] .fixture-body{display:none}
    @media(max-width:760px){#fixture-panel{left:8px;top:8px;width:250px}}
  </style>
</head>
<body>
  <aside id="fixture-panel" aria-label="격리된 브라우저 검증 도구">
    <h2>로컬 검증 전용</h2>
    <button type="button" id="fixture-collapse">검증 패널 접기</button>
    <div class="fixture-body">
      <p>테스트 주소: <b>localhost:8766</b> 또는 <b>127.0.0.1</b>. localhost:8765의 사용자 데이터와 분리됩니다. 앱 코드는 원본을 그대로 불러옵니다.</p>
      <label for="fixture-confirm">확인창 응답</label>
      <select id="fixture-confirm"><option value="yes">확인</option><option value="no">취소</option></select>
      <label for="fixture-geo">내 위치 결과 (합성 좌표)</label>
      <select id="fixture-geo"><option value="success">성공: 부산시청 합성 좌표</option><option value="denied">권한 거부</option><option value="timeout">시간 초과</option></select>
      <label for="fixture-delay">위치 응답 지연</label>
      <select id="fixture-delay"><option value="0">즉시</option><option value="1500">1.5초</option><option value="5000">5초</option></select>
      <label for="fixture-photo-delay">사진 처리 지연</label>
      <select id="fixture-photo-delay"><option value="0">즉시</option><option value="1500">1.5초</option></select>
      <label><input type="checkbox" id="fixture-quota"> 사진 저장만 용량 초과 처리</label>
      <p><button type="button" id="fixture-reset">테스트 데이터 초기화</button> <button type="button" id="fixture-refresh">상태 갱신</button></p>
      <output id="fixture-state" aria-label="검증 상태"></output>
      <pre id="fixture-log" aria-label="검증 호출 기록"></pre>
    </div>
  </aside>
  <div id="app" class="app" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="tests/fixtures.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/i18n.js"></script>
  <script src="js/data/foods.js"></script>
  <script src="js/data/community.js"></script>
  <script src="js/store.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
