<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>무보소 Gemini 테스트</title>
  <link rel="stylesheet" href="/__local/gemini/style.css">
  <script defer src="/__local/gemini/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>무보소 Gemini 테스트</h1>
      <button id="reset" type="button">새 대화</button>
      <p>입력한 대화는 Gemini에 전송됩니다. 무보소 식당 DB 연결은 준비 중입니다.</p>
    </header>
    <p id="status" role="status">Gemini 설정 확인 중…</p>
    <div id="messages" role="log" aria-label="대화"></div>
    <form id="composer">
      <textarea id="message" aria-label="메시지" rows="2" maxlength="2000" required placeholder="예: 해운대에서 만 원 이하로 혼밥하고 싶어요."></textarea>
      <button id="send" type="submit" disabled>보내기</button>
    </form>
  </main>
</body>
</html>
